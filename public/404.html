<!DOCTYPE html>
<html lang="tr">
<head>
    <!-- Olmayan adreslerde Netlify bu sayfayı 404 koduyla gösterir (2026-10-28; önce Netlify'ın İngilizce varsayılanı vardı).
         public/ altında: Vite derlemede olduğu gibi kopyalar. İzleme kodu yok. Mutlak yollar bilerek. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayfa bulunamadı | 12in12.co</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Manrope:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0B0B0C; --kart: #121214; --metin: #e2e8f0; --soluk: #94a3b8; --kenar: rgba(255,255,255,0.08); --sari: #FFD400; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--metin); font: 16px/1.7 'Inter', system-ui, sans-serif; }
        a { color: var(--sari); text-underline-offset: 3px; }
        :is(a, button):focus-visible { outline: 2px solid var(--sari); outline-offset: 3px; border-radius: 6px; }
        .atla { position: absolute; left: -9999px; top: 8px; background: var(--sari); color: #0B0B0C; padding: 8px 12px; border-radius: 8px; font-weight: 600; text-decoration: none; }
        .atla:focus { left: 8px; }
        header, main, footer { width: 100%; max-width: 780px; margin: 0 auto; padding: 0 16px; }
        header { padding-top: 28px; padding-bottom: 28px; border-bottom: 1px solid var(--kenar); }
        .logo { font: 800 22px/1 'Inter', sans-serif; color: #F4F4F5; text-decoration: none; letter-spacing: -0.04em; }
        main { flex: 1; padding-top: 56px; padding-bottom: 56px; }
        .kod { color: var(--sari); font-size: 14px; font-weight: 600; letter-spacing: .1em; margin: 0 0 8px; }
        h1 { font: 300 clamp(28px, 5vw, 40px)/1.2 'Manrope', sans-serif; color: #fff; margin: 0 0 16px; letter-spacing: -0.02em; text-wrap: balance; }
        p { color: var(--soluk); margin: 0 0 28px; text-wrap: pretty; }
        .dugmeler { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 40px; }
        .dugme { display: inline-flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.16); color: var(--metin); text-decoration: none; font-weight: 600; font-size: 15px; }
        .dugme.ana { background: var(--sari); border-color: var(--sari); color: #0B0B0C; }
        .dugme:hover { filter: brightness(1.08); }
        .en { padding-top: 20px; border-top: 1px solid var(--kenar); }
        .en p { font-size: 14px; margin: 0; }
        footer { color: #64748b; font-size: 13px; padding-top: 24px; padding-bottom: 32px; border-top: 1px solid var(--kenar); display: flex; gap: 16px; }
        footer a { color: var(--soluk); }
    </style>
</head>
<body>
    <a class="atla" href="#icerik">İçeriğe geç</a>
    <header><a class="logo" href="/">12in12.co</a></header>
    <main id="icerik">
        <p class="kod">404</p>
        <h1>Aradığın sayfa burada değil</h1>
        <p>Adres yanlış yazılmış ya da sayfa taşınmış olabilir. 12 ayda 12 iş kurma yolculuğunun bütün bölümleri ana sayfada.</p>
        <div class="dugmeler">
            <a class="dugme ana" href="/#girisimler">Girişimlere bak</a>
            <a class="dugme" href="/">Ana sayfaya dön</a>
        </div>
        <div class="en" lang="en"><p>Page not found. <a href="/">Go to the homepage</a>.</p></div>
    </main>
    <footer><a href="/gizlilik">Gizlilik</a><a href="/kosullar">Koşullar</a></footer>
</body>
</html>
